[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/clounnm/apibreak"
homepage = "https://github.com/clounnm/apibreak"

[profile.release]
lto = "thin"
strip = true

# dist builds with this profile.
[profile.dist]
inherits = "release"
